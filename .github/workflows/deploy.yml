name: Deploy to XServer

# on（トリガー）：いつ実行するか
on:
  push:
    branches:
      - main # 今使っているブランチ名

# jobs（ジョブ）：何を実行するか
jobs:
  deploy:
    runs-on: ubuntu-latest # GitHub上の仮想サーバー（Ubuntu）が起動し、Node.js環境をセットアップ。

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        # ここに Supabase の鍵をセットします
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./xs205671.xsrv.jp/public_html/todo-list/
